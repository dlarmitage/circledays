<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CircleDays</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #faf9f7;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .container { text-align: center; max-width: 320px; }
    .icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0d9488, #0d5c5c);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      color: white; font-weight: bold; font-size: 28px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 15px; color: #666; margin-bottom: 24px; line-height: 1.5; }
    button {
      background: #0d9488; color: white; border: none;
      padding: 12px 32px; border-radius: 12px;
      font-size: 15px; font-weight: 500; cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">C</div>
    <h1>No Connection</h1>
    <p>CircleDays needs an internet connection. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
